name: Bug report
description: Something does not work as expected (HDR does not switch, a game is not detected, a crash, …)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! The log file is the most helpful part:
        **Settings › Advanced › Open log file** (or `%LocalAppData%\SmartHdrManager\log.txt`).
        Reproduce the problem once, then attach the file below (drag it into the box).
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings › Updates shows it (or right-click SmartHdrManager.exe › Properties › Details)
      placeholder: "2.6.2"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings › System › About, e.g. "Windows 11 25H2". The log also shows it in the "Display control" line.
      placeholder: "Windows 11 25H2"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and driver version
      placeholder: "NVIDIA RTX 4070, driver 581.xx"
    validations:
      required: true
  - type: textarea
    id: monitors
    attributes:
      label: Monitor(s)
      description: Model, how they are connected, and which one(s) support HDR. Which monitor does the game / video run on?
      placeholder: "LG C3 (HDMI, HDR) as main screen + Dell 27\" (SDR)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? For games, also say where you got it (Steam, GOG, Epic, …).
      placeholder: "Started The Witcher 3 (GOG). Expected HDR to turn on, but it stayed in SDR."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Attach log.txt (drag & drop), or paste the relevant lines.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: e.g. the line under the game's name in the Games tab ("GOG · …exe"), screenshots, the browser and script version for YouTube problems.
    validations:
      required: false
